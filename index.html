<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let's fold an origami axolotl</title>
<meta name="description" content="A calm, step-by-step guide to folding a simple origami axolotl from one square of paper.">
<meta name="theme-color" content="#F5F5F7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22%3E%3Cpath d=%22M1 2h8L5 9z%22 fill=%22%23FF9EBB%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1A1A1A; --muted:#737373; --line:#E5E5EA;
  --paper-front:#FF9EBB; --paper-back:#FFC2D1;
  --ease:cubic-bezier(.25,1,.5,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:440px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 24px 0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-size:22px;line-height:1.25;font-weight:600;letter-spacing:-.015em;margin:0}
.sub{font-size:14px;line-height:1.4;color:var(--muted);margin:4px 0 0}
.kid{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:5px 0 5px 6px;font-size:12px;font-weight:500;color:var(--muted)}
.kid .sw{width:28px;height:17px;border-radius:99px;background:var(--line);position:relative;transition:background .25s var(--ease)}
.kid .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .25s var(--ease)}
.kid[aria-pressed="true"]{color:var(--ink)}
.kid[aria-pressed="true"] .sw{background:var(--ink)}
.kid[aria-pressed="true"] .sw::after{transform:translateX(11px)}

.meta{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pill{font-size:12px;font-weight:500;line-height:1;color:var(--ink);border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 11px}
.progress{display:flex;gap:4px;margin-top:10px}
.seg{flex:1;height:16px;padding:0;border:0;background:none;display:flex;align-items:center}
.seg i{display:block;width:100%;height:3px;border-radius:3px;background:var(--line);transition:background .3s var(--ease)}
.seg.on i{background:var(--ink)}
.seg.cur i{background:var(--ink);opacity:.45}

.stage{position:relative;margin:14px auto 0;width:100%;max-width:calc(100svh - 450px);min-width:260px;aspect-ratio:1/1;background:var(--card);border-radius:28px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px rgba(0,0,0,.05),0 30px 70px rgba(0,0,0,.07);touch-action:pan-y}
.stage canvas,.stage svg.fb{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg.fb{display:none}
.stage.use-svg svg.fb{display:block}
.stage.use-svg canvas{display:none}
.stage .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:11px;color:#A1A1A6;letter-spacing:.02em;pointer-events:none;transition:opacity .6s}
.stage .loading{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--muted);transition:opacity .4s}

.scrub{margin:16px 6px 0;height:26px;display:flex;align-items:center;cursor:pointer;touch-action:none;transition:opacity .3s}
.scrub[hidden]{display:flex;visibility:hidden;opacity:0}
.track{position:relative;width:100%;height:4px;border-radius:4px;background:var(--line)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink)}
.thumb{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--bg);transition:transform .15s var(--ease)}
.scrub:active .thumb,.scrub.drag .thumb{transform:scale(1.25)}

.copy{margin-top:14px;min-height:150px;transition:opacity .22s var(--ease),transform .32s var(--ease)}
.copy.out{opacity:0;transform:translateX(calc(var(--dir,1) * -14px))}
.copy.pre{opacity:0;transform:translateX(calc(var(--dir,1) * 14px));transition:none}
.copy h2{font-size:18px;line-height:1.3;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.copy p{font-size:15px;line-height:1.5;margin:0}
.copy .tip{font-size:14px;line-height:1.45;color:var(--muted);margin-top:10px}
.copy .tip b{font-weight:600;color:var(--muted)}
.list{list-style:none;margin:12px 0 0;padding:0}
.list li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:4px}
.list svg{flex:none;width:22px;height:22px;margin-top:1px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.list .t{font-size:15px;font-weight:500;line-height:1.35}
.list .d{font-size:14px;color:var(--muted);line-height:1.4;margin-top:1px}
.sw-paper{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px;background:linear-gradient(135deg,var(--paper-front) 50%,var(--paper-back) 50%)}
.credit{font-size:12px;line-height:1.5;color:#8E8E93;margin:18px 0 0}
.credit a{color:#6E6E73;text-decoration:underline;text-underline-offset:2px;text-decoration-color:#C7C7CC}

footer.bar{position:sticky;bottom:0;margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 0 calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(245,245,247,0),var(--bg) 34%);z-index:5}
.prev{border:0;background:none;padding:12px 6px 12px 0;font-size:15px;font-weight:500;color:var(--muted);border-radius:12px}
.prev:hover{color:var(--ink)}
.prev[hidden]{display:block;visibility:hidden}
.next{border:0;background:var(--ink);color:#fff;border-radius:99px;padding:14px 22px;font-size:15px;font-weight:500;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.14);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.next:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(0,0,0,.16)}
.next:active{transform:scale(.97)}

/* Kid mode: bigger, friendlier text */
body.kid-on h1{font-size:24px}
body.kid-on .copy h2{font-size:22px}
body.kid-on .copy p{font-size:19px;line-height:1.45}
body.kid-on .copy .tip{font-size:16px}
body.kid-on .next{font-size:17px;padding:16px 26px}
body.kid-on .prev{font-size:16px}

/* Confetti (restrained) */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;left:50%;top:46%;width:7px;height:10px;border-radius:2px;opacity:0;
  animation:conf 2.2s var(--ease) forwards;animation-delay:var(--d)}
@keyframes conf{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.6)}
  8%{opacity:1}
  45%{transform:translate(calc(-50% + var(--x1)),calc(-50% + var(--y1))) rotate(calc(var(--r) * .5)) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--x2)),calc(-50% + var(--y2))) rotate(var(--r)) scale(.9)}
}
@media (min-width:700px){ .app{padding-top:40px} }
@media (prefers-reduced-motion:reduce){ .copy,.copy.out,.copy.pre{transition:none;transform:none} .confetti{display:none} }
/* level switch (links to the intermediate guide) */
.levels{display:inline-flex;padding:2px;border-radius:9px;background:#EAEAEF;margin:0 0 14px}
.levels a{font-size:12px;font-weight:500;line-height:1;color:var(--muted);text-decoration:none;padding:6px 11px;border-radius:7px;transition:background .2s,color .2s}
.levels a[aria-current="page"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 1px 6px rgba(0,0,0,.04)}
.levels a:not([aria-current]):hover{color:var(--ink)}
.stage{max-width:calc(100svh - 486px)}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <nav class="levels" aria-label="Difficulty"><a href="index.html" aria-current="page">Beginner</a><a href="intermediate.html">Intermediate</a></nav>
    <div class="title-row">
      <h1 id="title">Let's fold an origami axolotl!</h1>
      <button class="kid" id="kidBtn" type="button" aria-pressed="false" title="Bigger text and simpler words"><span>Kid mode</span><span class="sw" aria-hidden="true"></span></button>
    </div>
    <p class="sub">Beginner-friendly, about 10 to 15 mins.</p>
    <div class="meta">
      <span class="eyebrow" id="eyebrow">Before you start</span>
      <span class="pill">Beginner</span>
    </div>
    <nav class="progress" id="progress" aria-label="Jump to a step"></nav>
  </header>

  <main id="main">
    <section class="stage" id="stage" role="img" aria-label="3D model of the finished origami axolotl">
      <canvas id="gl" aria-hidden="true"></canvas>
      <svg class="fb" id="fb" viewBox="-1.9 -1.75 3.8 3.8" aria-hidden="true"></svg>
      <div class="loading" id="loading">Unfolding paper…</div>
      <div class="hint" id="hint">Drag to turn</div>
      <div class="confetti" id="confetti" aria-hidden="true"></div>
    </section>

    <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Fold animation. Drag to play the fold back and forth" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
      <div class="track"><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div>
    </div>

    <section class="copy" id="copy" aria-live="polite"></section>
  </main>

  <footer class="bar">
    <button class="prev" id="prev" type="button">‹ Previous step</button>
    <button class="next" id="next" type="button">Start folding ›</button>
  </footer>
</div>

<script type="module">
/* =====================================================================
   Origami axolotl: a tiny flat-folding engine.
   The paper is a set of convex polygons (in paper coordinates) with a
   rigid 3D transform each. Every step splits faces along its crease and
   rotates the chosen faces about that crease, so each state is derived
   from the previous one and the diagrams can't contradict each other.
   ===================================================================== */
const PI = Math.PI;
const S = 1.25;          // world units per paper unit (paper is a diamond of half-diagonal 1)
const EPS = 0.0075;      // layer spacing
const Y0 = 0.17;         // model hover height over the "table"
const R2 = Math.SQRT2;
const KX = 2 - R2, KY = 1 - R2;                // kite side corners (±KX, KY)
const FY = 3 - 2 * R2;                         // where the top point lands; leg creases meet here too
const EX = 0.5;                                // where the leg crease starts on the flap's top edge
const GX1 = 0.47, GY2 = -0.32, GX2 = KX * (1 - (GY2 - KY) / R2); // gill bend line

// ---------- vector / affine helpers ----------
const vAdd=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const vSub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const vScale=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const vCross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vNorm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return vScale(a,1/l)};
const mulV=(m,p)=>[m[0]*p[0]+m[1]*p[1]+m[2]*p[2],m[3]*p[0]+m[4]*p[1]+m[5]*p[2],m[6]*p[0]+m[7]*p[1]+m[8]*p[2]];
const applyA=(A,p)=>vAdd(mulV(A.m,p),A.t);
function mulM(a,b){const r=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)r[i*3+j]=a[i*3]*b[j]+a[i*3+1]*b[3+j]+a[i*3+2]*b[6+j];return r}
const compose=(A,B)=>({m:mulM(A.m,B.m),t:vAdd(mulV(A.m,B.t),A.t)});
function rotAbout(a,u,ang){
  const [x,y,z]=u,c=Math.cos(ang),s=Math.sin(ang),C=1-c;
  const m=[c+x*x*C,x*y*C-z*s,x*z*C+y*s, y*x*C+z*s,c+y*y*C,y*z*C-x*s, z*x*C-y*s,z*y*C+x*s,c+z*z*C];
  return {m,t:vSub(a,mulV(m,a))};
}
const toWorld=(v,h=0)=>[v[0]*S,h,v[1]*S];
const toView=w=>[w[0]/S,w[2]/S];
function side2(line,q){const a=line[0],b=line[1];const dx=b[0]-a[0],dy=b[1]-a[1];return (dx*(q[1]-a[1])-dy*(q[0]-a[0]))/Math.hypot(dx,dy)}
const easeOutQuart=t=>1-Math.pow(1-t,4);
const smooth=t=>t*t*(3-2*t);

// ---------- faces ----------
function faceVerts(f){return f.poly.map(q=>applyA(f.M,[q[0],q[1],0]))}
function centroid2(pts){let x=0,y=0;pts.forEach(p=>{x+=p[0];y+=p[1]});return [x/pts.length,y/pts.length]}
function viewCentroid(f){return centroid2(faceVerts(f).map(toView))}
function paperCentroid(f){return centroid2(f.poly)}

function splitFaces(faces,line){
  const out=[], E=1e-7;
  for(const f of faces){
    const d=faceVerts(f).map(toView).map(q=>side2(line,q));
    if(!(d.some(x=>x>E)&&d.some(x=>x<-E))){out.push(f);continue}
    const A=[],B=[],n=f.poly.length;
    for(let i=0;i<n;i++){
      const j=(i+1)%n,pi=f.poly[i],pj=f.poly[j],di=d[i],dj=d[j];
      if(di>=-E)A.push(pi); if(di<=E)B.push(pi);
      if((di>E&&dj<-E)||(di<-E&&dj>E)){const t=di/(di-dj);const m=[pi[0]+(pj[0]-pi[0])*t,pi[1]+(pj[1]-pi[1])*t];A.push(m);B.push(m)}
    }
    out.push({...f,poly:A},{...f,poly:B});
  }
  return out;
}

// initial paper: a square (diamond in paper coords), shown turned 45° so step 1 can spin it
function initFaces(){
  const base={m:[S,0,0, 0,0,-S, 0,S,0],t:[0,0,0]};       // paper (x,y,0) -> world (Sx, 0, Sy)
  const M=compose(rotAbout([0,0,0],[0,1,0],PI/4),base);
  let poly=[[0,-1],[1,0],[0,1],[-1,0]];
  const f={poly,M,off:[0,0,0],L:0};
  const v=faceVerts(f); const n=vCross(vSub(v[1],v[0]),vSub(v[2],v[0]));
  if(n[1]<0) f.poly=poly.slice().reverse();               // front-facing winding = pale (back) side, facing up
  return [f];
}

// ---------- the folding sequence ----------
const LEFT_FLAP=[[0,1],[-KX,KY]], RIGHT_FLAP=[[0,1],[KX,KY]];
const inFlap=(line,ref)=>f=>Math.sign(side2(line,paperCentroid(f)))===Math.sign(side2(line,ref));

const OPS=[
  {type:'spin',angle:-PI/4},
  {type:'foldUnfold',line:[[0,-1],[0,1]],side:[-0.5,0],dir:'valley',guide:[[0,-1],[0,1]],
    arrows:[{a:[-0.62,0.12,0.02],b:[0.62,0.12,0.02],h:0.55}]},
  {type:'fold',line:[[0,1],[-KX,KY]],side:[-0.9,0],dir:'valley',guide:[[0,1],[-KX,KY]],ref:[[0,-1],[0,1]],
    arrows:[{a:[-0.82,-0.03,0.02],b:[-0.1,-0.34,0.03],h:0.42}]},
  {type:'fold',line:[[0,1],[KX,KY]],side:[0.9,0],dir:'valley',guide:[[0,1],[KX,KY]],ref:[[0,-1],[0,1]],
    arrows:[{a:[0.82,-0.03,0.02],b:[0.1,-0.34,0.06],h:0.42}]},
  {type:'fold',line:[[-EX,KY],[0,FY]],side:[-0.06,-0.38],dir:'valley',select:inFlap(LEFT_FLAP,[-1,0]),guide:[[-EX,KY],[0,FY]],
    arrows:[{a:[-0.08,-0.33,0.06],b:[-0.52,0.04,0.07],h:0.3}]},
  {type:'fold',line:[[EX,KY],[0,FY]],side:[0.06,-0.38],dir:'valley',select:inFlap(RIGHT_FLAP,[1,0]),guide:[[EX,KY],[0,FY]],
    arrows:[{a:[0.08,-0.33,0.06],b:[0.52,0.04,0.07],h:0.3}]},
  {type:'fold',line:[[-KX,KY],[KX,KY]],side:[0,-0.8],dir:'valley',guide:[[-KX,KY],[KX,KY]],
    arrows:[{a:[0,-0.84,0.02],b:[0,0.08,0.08],h:0.5}]},
  {type:'turn',arrows:[{a:[-0.75,0.32,0.05],b:[0.75,0.32,0.05],h:0.95}]},
  {type:'bend',groups:[
      {line:[[-GX1,KY],[-GX2,GY2]],side:[-0.54,-0.39],angle:1.2,dir:'valley',filter:c=>c[0]<0},
      {line:[[GX1,KY],[GX2,GY2]],side:[0.54,-0.39],angle:1.2,dir:'valley',filter:c=>c[0]>0}],
    guides:[[[-GX1,KY],[-GX2,GY2]],[[GX1,KY],[GX2,GY2]]],
    arrows:[{a:[-0.47,-0.3,0.04],b:[-0.62,-0.5,0.3],h:0.06},{a:[0.47,-0.3,0.04],b:[0.62,-0.5,0.3],h:0.06}]},
  {type:'bend',groups:[
      {line:[[-KX,KY],[0,1]],side:[-0.62,-0.02],angle:0.38,dir:'mountain',filter:c=>c[0]<0&&c[1]>-0.36&&c[1]<0.32},
      {line:[[KX,KY],[0,1]],side:[0.62,-0.02],angle:0.38,dir:'mountain',filter:c=>c[0]>0&&c[1]>-0.36&&c[1]<0.32}],
    guides:[[[-0.524,-0.264],[-0.368,0.113]],[[0.524,-0.264],[0.368,0.113]]],mountain:true,
    arrows:[{a:[-0.58,-0.12,0.1],b:[-0.64,0.1,-0.05],h:0.04},{a:[0.58,-0.12,0.1],b:[0.64,0.1,-0.05],h:0.04}]},
  {type:'bend',groups:[{line:[[-1,0.56],[1,0.56]],side:[0,0.9],angle:0.36,dir:'valley'}],
    guides:[[[-0.27,0.56],[0.27,0.56]]],
    arrows:[{a:[0.12,0.98,0.04],b:[0.12,0.8,0.32],h:0.06}]},
  {type:'face'}
];

function makeGroup(line,sideRef,dir,ang,kind){
  const a=toWorld(line[0]); const u=vNorm(vSub(toWorld(line[1]),a));
  const test=applyA(rotAbout(a,u,PI/2),toWorld(sideRef));
  const up=test[1]>0; const sign=(up===(dir==='valley'))?1:-1;
  return {a,u,ang:ang*sign,kind};
}

function buildSnapshots(){
  let faces=initFaces();
  const snaps=[];
  for(const op of OPS){
    const lines=op.type==='fold'||op.type==='foldUnfold'?[op.line]:op.type==='bend'?op.groups.map(g=>g.line):[];
    for(const l of lines) faces=splitFaces(faces,l);
    const Ls=faces.map(f=>f.L), maxL=Math.max(...Ls), minL=Math.min(...Ls);
    const info=faces.map(()=>({g:-1,Lnew:null}));
    const groups=[];
    if(op.type==='spin'){groups.push({a:[0,0,0],u:[0,1,0],ang:op.angle,kind:'spin'});info.forEach(i=>i.g=0)}
    if(op.type==='turn'){groups.push({a:[0,0,0],u:[0,0,1],ang:PI,kind:'turn'});faces.forEach((f,i)=>{info[i].g=0;info[i].Lnew=maxL-f.L+minL})}
    if(op.type==='fold'||op.type==='foldUnfold'){
      groups.push(makeGroup(op.line,op.side,op.dir,op.angle||PI,op.type));
      const sref=Math.sign(side2(op.line,op.side));
      const mov=[];
      faces.forEach((f,i)=>{if(Math.sign(side2(op.line,viewCentroid(f)))===sref&&(!op.select||op.select(f))){info[i].g=0;mov.push(i)}});
      const movMax=Math.max(...mov.map(i=>faces[i].L));
      mov.forEach(i=>info[i].Lnew=op.type==='fold'?maxL+1+(movMax-faces[i].L):faces[i].L);
    }
    if(op.type==='bend'){
      op.groups.forEach((g,gi)=>{
        groups.push(makeGroup(g.line,g.side,g.dir,g.angle,'bend'));
        const sref=Math.sign(side2(g.line,g.side));
        faces.forEach((f,i)=>{const c=viewCentroid(f);if(info[i].g<0&&Math.sign(side2(g.line,c))===sref&&(!g.filter||g.filter(c)))info[i].g=gi});
      });
    }
    const snap={op,faces,info,groups,base:faces.map(faceVerts),maxL};
    snap.edges=computeEdges(snap);
    snaps.push(snap);
    // apply the full step to get the next state
    faces=faces.map((f,i)=>{
      const inf=info[i]; if(inf.g<0||op.type==='foldUnfold') return f;
      const g=groups[inf.g]; const R=rotAbout(g.a,g.u,g.ang);
      const M=compose(R,f.M);
      if(g.kind==='fold'||g.kind==='turn') return {...f,M,off:[0,inf.Lnew*EPS,0],L:inf.Lnew};
      return {...f,M,off:mulV(R.m,f.off)};
    });
  }
  const final={op:{type:'final'},faces,info:faces.map(()=>({g:-1})),groups:[],base:faces.map(faceVerts),maxL:Math.max(...faces.map(f=>f.L))};
  final.edges=computeEdges(final);
  return {snaps,final};
}

const keyOf=p=>p[0].toFixed(5)+','+p[1].toFixed(5);
function sameT(a,b){for(let i=0;i<9;i++)if(Math.abs(a.M.m[i]-b.M.m[i])>1e-6)return false;for(let i=0;i<3;i++)if(Math.abs(a.M.t[i]-b.M.t[i])>1e-6)return false;return a.L===b.L}
function computeEdges(snap){
  const map=new Map();
  snap.faces.forEach((f,fi)=>f.poly.forEach((p,i)=>{const q=f.poly[(i+1)%f.poly.length];const k=[keyOf(p),keyOf(q)].sort().join('|');if(!map.has(k))map.set(k,[]);map.get(k).push([fi,i])}));
  const edges=[];
  for(const [,list] of map){
    for(const [fi,i] of list){
      const others=list.filter(o=>o[0]!==fi);
      const hidden=others.some(([gi])=>sameT(snap.faces[fi],snap.faces[gi])&&snap.info[fi].g===snap.info[gi].g);
      if(!hidden){edges.push([fi,i]);break}   // draw each visible edge once
    }
  }
  return edges;
}

// evaluate world vertices of every face for snapshot s at progress p (0..1)
function evalSnap(s,p,noOff){
  const t=s.op.type;
  let frac=p;
  if(t==='foldUnfold') frac=p<0.5?smooth(p*2):smooth((1-p)*2);
  if(t==='face'||t==='final') frac=1;
  const Rs=s.groups.map(g=>rotAbout(g.a,g.u,g.ang*frac));
  return s.faces.map((f,i)=>{
    const inf=s.info[i],base=s.base[i];
    if(noOff){ if(inf.g<0) return base; const R0=Rs[inf.g]; return base.map(v=>applyA(R0,v)); }
    if(inf.g<0) return base.map(v=>vAdd(v,f.off));
    const g=s.groups[inf.g],R=Rs[inf.g];
    let off;
    if(g.kind==='fold'||g.kind==='turn'){
      off=vAdd(vScale(mulV(R.m,f.off),1-frac),[0,inf.Lnew*EPS*frac,0]);
      off[1]+=g.kind==='turn'?Math.sin(PI*frac)*S*0.42:Math.sin(PI*frac)*0.07;
    }else if(g.kind==='foldUnfold'){
      off=vAdd(mulV(R.m,f.off),[0,(s.maxL+1)*EPS*Math.min(1,frac*4)+Math.sin(PI*frac)*0.05,0]);
    }else off=mulV(R.m,f.off);
    if(g.kind==='turn'){ // swing it a little towards the viewer mid-flip so it never goes edge-on
      const Y=rotAbout([0,0,0],[0,1,0],0.6*Math.sin(PI*frac));
      return base.map(v=>applyA(Y,vAdd(applyA(R,v),off)));
    }
    return base.map(v=>vAdd(applyA(R,v),off));
  });
}

const {snaps:SNAPS,final:FINAL}=buildSnapshots();

// Self-check: neighbouring faces must stay joined along their shared edges (no tearing) at the start, middle and end of each step.
function verify(){
  const problems=[];
  const check=(s,label,p)=>{
    const W=evalSnap(s,p,true);
    const map=new Map();
    s.faces.forEach((f,fi)=>f.poly.forEach((q,i)=>{const r=f.poly[(i+1)%f.poly.length];const k=[keyOf(q),keyOf(r)].sort().join('|');(map.get(k)||map.set(k,[]).get(k)).push([fi,i])}));
    for(const [k,list] of map){ if(list.length<2) continue;
      for(let a=0;a<list.length;a++)for(let b=a+1;b<list.length;b++){
        const [fa,ia]=list[a],[fb,ib]=list[b];
        const pa=[W[fa][ia],W[fa][(ia+1)%W[fa].length]], pb=[W[fb][ib],W[fb][(ib+1)%W[fb].length]];
        // compare ignoring the tiny layer offsets
        const dist=(x,y)=>Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]);
        const d=Math.min(Math.max(dist(pa[0],pb[0]),dist(pa[1],pb[1])),Math.max(dist(pa[0],pb[1]),dist(pa[1],pb[0])));
        const dy=Math.min(Math.max(Math.abs(pa[0][1]-pb[0][1]),Math.abs(pa[1][1]-pb[1][1])),Math.max(Math.abs(pa[0][1]-pb[1][1]),Math.abs(pa[1][1]-pb[0][1])));
        if(d>1e-6) problems.push(label+' p='+p+' edge '+k+' gap '+d.toFixed(4)+' dy '+dy.toFixed(3));
      }}
  };
  SNAPS.forEach((s,i)=>{[0,0.5,1].forEach(p=>check(s,'step '+(i+1),p))});
  return problems;
}

  if(step>=N-1){const k=step===N?1:easeOutQuart(p);if(k>0.01){const ey=-0.29;h+=`<circle cx="-0.17" cy="${ey}" r="${0.042*k}" fill="#1A1A1A"/><circle cx="0.17" cy="${ey}" r="${0.042*k}" fill="#1A1A1A"/><path d="M-0.07 -0.2 Q0 ${-0.2+0.07*k} 0.07 -0.2" stroke="#1A1A1A" stroke-width=".016" fill="none" stroke-linecap="round" opacity="${k}"/>`}}
  fb.innerHTML=h;
}

// ---------- WebGL (Three.js) ----------
let onViewChange=null;
let gl=null;
async function initGL(){
  const force=new URLSearchParams(location.search).has('svg');
  if(force) throw new Error('forced svg');
  const test=document.createElement('canvas');
  if(!(test.getContext('webgl2')||test.getContext('webgl'))) throw new Error('no webgl');
  let THREE;
  try{THREE=await import('https://unpkg.com/three@0.160.0/build/three.module.js')}
  catch(e){THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js')}
  const canvas=$('#gl');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(30,1,0.1,60);
  camera.position.set(0,4.75,3.2); camera.lookAt(0,0.12,0.16);

  scene.add(new THREE.HemisphereLight(0xffffff,0xf3e9ec,2.1));
  const key=new THREE.DirectionalLight(0xffffff,1.25);
  key.position.set(-2.2,7,3.2); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048); key.shadow.radius=7; key.shadow.bias=-0.0004;
  Object.assign(key.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:1,far:20});
  scene.add(key);
  const rim=new THREE.DirectionalLight(0xffffff,0.35); rim.position.set(3,2,-3); scene.add(rim);

  // ground: soft contact shadow + soft blob
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.ShadowMaterial({opacity:0.075}));
  ground.rotation.x=-PI/2; ground.receiveShadow=true; scene.add(ground);
  const bc=document.createElement('canvas'); bc.width=bc.height=128; const bx=bc.getContext('2d');
  const gr=bx.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(0,0,0,0.16)'); gr.addColorStop(0.55,'rgba(0,0,0,0.06)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  bx.fillStyle=gr; bx.fillRect(0,0,128,128);
  const blob=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(bc),transparent:true,depthWrite:false}));
  blob.rotation.x=-PI/2; blob.position.y=0.002; blob.scale.set(3.0,3.0,1); scene.add(blob);

  const group=new THREE.Group(); group.position.y=Y0; scene.add(group);
  const geo=new THREE.BufferGeometry();
  const common={roughness:0.94,metalness:0,flatShading:true,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1,shadowSide:THREE.DoubleSide};
  const matPale=new THREE.MeshStandardMaterial({...common,color:0xFFC2D1,side:THREE.FrontSide});
  const matPink=new THREE.MeshStandardMaterial({...common,color:0xFF9EBB,side:THREE.BackSide});
  const meshA=new THREE.Mesh(geo,matPale), meshB=new THREE.Mesh(geo,matPink);
  meshA.castShadow=meshB.castShadow=true; group.add(meshA,meshB);
  const egeo=new THREE.BufferGeometry();
  const edges=new THREE.LineSegments(egeo,new THREE.LineBasicMaterial({color:0x8a3a55,transparent:true,opacity:0.28}));
  group.add(edges);

  // guides & arrows (rebuilt per step)
  const guideGroup=new THREE.Group(); group.add(guideGroup);
  const ink=0x1A1A1A;
  const guideMat=new THREE.MeshBasicMaterial({color:ink,transparent:true,opacity:0.7,depthWrite:false});
  const refMat=new THREE.MeshBasicMaterial({color:ink,transparent:true,opacity:0.16,depthWrite:false});
  const arrowMat=new THREE.MeshBasicMaterial({color:ink,transparent:true,opacity:0.8,depthWrite:false});
  function dashGeom(seg,h,mountain,solid){
    const a=toWorld(seg[0],h),b=toWorld(seg[1],h); const d=vSub(b,a); const len=Math.hypot(d[0],d[2]); const u=[d[0]/len,0,d[2]/len]; const n=[-u[2],0,u[0]];
    const w=solid?0.006:0.0105; const pos=[];
    const pattern=solid?[[0,len]]:(()=>{const out=[];let s=0;const dash=0.085,gap=0.05;while(s<len){if(mountain){out.push([s,Math.min(len,s+dash)]);s+=dash+0.04;if(s<len)out.push([s,Math.min(len,s+0.016)]);s+=0.016+0.04}else{out.push([s,Math.min(len,s+dash)]);s+=dash+gap}}return out})();
    for(const [s0,s1] of pattern){
      const p0=vAdd(a,vScale(u,s0)),p1=vAdd(a,vScale(u,s1));
      const q=[vAdd(p0,vScale(n,w)),vSub(p0,vScale(n,w)),vSub(p1,vScale(n,w)),vAdd(p1,vScale(n,w))];
      pos.push(...q[0],...q[1],...q[2],...q[0],...q[2],...q[3]);
    }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); return g;
  }
  let guideMeshes=[],arrowMeshes=[],builtFor=null;
  function buildGuides(snap,step){
    guideGroup.clear(); guideMeshes=[]; arrowMeshes=[];
    if(step>=N) return;
    const top=(snap.maxL+1)*EPS+0.006;
    guidesFor(snap).forEach(g=>{const m=new THREE.Mesh(dashGeom(g.seg,top,g.mountain),guideMat);m.side=THREE.DoubleSide;m.renderOrder=3;guideGroup.add(m);guideMeshes.push(m)});
    if(snap.op.ref){const m=new THREE.Mesh(dashGeom(snap.op.ref,top-0.002,false,true),refMat);m.renderOrder=2;guideGroup.add(m)}
    (snap.op.arrows||[]).forEach(ar=>{
      const A=new THREE.Vector3(ar.a[0]*S,top+ar.a[2],ar.a[1]*S),B=new THREE.Vector3(ar.b[0]*S,top+ar.b[2],ar.b[1]*S);
      const M=A.clone().add(B).multiplyScalar(0.5); M.y+=ar.h*S;
      const curve=new THREE.QuadraticBezierCurve3(A,M,B);
      const tan=curve.getTangent(1).normalize();
      const end=B.clone().sub(tan.clone().multiplyScalar(0.07));
      const curve2=new THREE.QuadraticBezierCurve3(A,M,end);
      const tube=new THREE.Mesh(new THREE.TubeGeometry(curve2,48,0.0115,8,false),arrowMat);
      const cone=new THREE.Mesh(new THREE.ConeGeometry(0.034,0.09,16),arrowMat);
      cone.position.copy(end.clone().add(tan.clone().multiplyScalar(0.045)));
      cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),tan);
      tube.renderOrder=cone.renderOrder=4;
      guideGroup.add(tube,cone); arrowMeshes.push(tube,cone);
    });
  }
  // face (pen drawing)
  const faceGroup=new THREE.Group(); group.add(faceGroup);
  const penMat=new THREE.MeshBasicMaterial({color:ink});
  const eyeGeo=new THREE.CircleGeometry(0.052,32); eyeGeo.rotateX(-PI/2);
  const shineMat=new THREE.MeshBasicMaterial({color:0xffffff});
  const shineGeo=new THREE.CircleGeometry(0.014,16); shineGeo.rotateX(-PI/2);
  const ey=TOP_EYE_Y();
  [-1,1].forEach(sx=>{
    const e=new THREE.Mesh(eyeGeo,penMat); e.position.set(sx*0.17*S,ey,-0.29*S); faceGroup.add(e);
    const sh=new THREE.Mesh(shineGeo,shineMat); sh.position.set(sx*0.17*S+0.018,ey+0.001,-0.29*S-0.02); faceGroup.add(sh);
  });
  const smileCurve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(-0.075*S,ey,-0.2*S),new THREE.Vector3(0,ey,-0.13*S),new THREE.Vector3(0.075*S,ey,-0.2*S));
  const smile=new THREE.Mesh(new THREE.TubeGeometry(smileCurve,24,0.0085,6,false),penMat); faceGroup.add(smile);

  // drag to turn
  let yaw=0,yawVel=0,dragX=null,lastDrag=0;
  canvas.addEventListener('pointerdown',e=>{dragX=e.clientX;canvas.setPointerCapture(e.pointerId);hint.style.opacity=0});
  canvas.addEventListener('pointermove',e=>{if(dragX===null)return;const dx=e.clientX-dragX;dragX=e.clientX;yaw+=dx*0.012;yawVel=dx*0.012;lastDrag=performance.now()});
  const up=()=>{dragX=null};
  canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
  canvas.style.touchAction='pan-y';

  function resize(){const r=stage.getBoundingClientRect();const s=Math.max(1,Math.round(r.width));renderer.setSize(s,s,false);camera.aspect=1;camera.updateProjectionMatrix()}
  new ResizeObserver(resize).observe(stage); resize();

  let curSnap=null,triCount=0;
  function setSnap(snap){
    curSnap=snap;
    triCount=snap.faces.reduce((a,f)=>a+f.poly.length-2,0);
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(triCount*9),3));
    geo.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(triCount*9),3));
    egeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(snap.edges.length*6),3));
  }
  let spinAngle=0,lastT=performance.now();
  function frame(now){
    const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
    if(playing){const k=Math.min(1,(now-playStart)/playDur);progress=easeOutQuart(k);if(k>=1){playing=false}updateScrub()}
    const {snap,p,step}=currentScene();
    if(snap!==curSnap) setSnap(snap);
    const key=snap===FINAL?'final':step;
    if(builtFor!==key){buildGuides(snap,step);builtFor=key}
    const W=evalSnap(snap,p);
    const pos=geo.attributes.position.array; let o=0;
    for(const vs of W){for(let i=1;i<vs.length-1;i++){for(const v of [vs[0],vs[i],vs[i+1]]){pos[o++]=v[0];pos[o++]=v[1];pos[o++]=v[2]}}}
    geo.attributes.position.needsUpdate=true; geo.computeVertexNormals(); geo.computeBoundingSphere();
    const ep=egeo.attributes.position.array; o=0;
    for(const [fi,i] of snap.edges){const vs=W[fi];const a=vs[i],b=vs[(i+1)%vs.length];ep[o++]=a[0];ep[o++]=a[1]+0.0015;ep[o++]=a[2];ep[o++]=b[0];ep[o++]=b[1]+0.0015;ep[o++]=b[2]}
    egeo.attributes.position.needsUpdate=true; egeo.computeBoundingSphere();
    // guides fade as the fold completes
    const op=snap.op;
    guideMat.opacity=op.type==='foldUnfold'?0.7:0.7*(1-0.85*smooth(Math.min(1,p*1.3)));
    arrowMat.opacity=0.8*(1-smooth(Math.min(1,p*1.6)));
    // pen face
    const fk=step===N?1:step===N-1?easeOutQuart(p):0;
    faceGroup.visible=fk>0.01; faceGroup.children.forEach(c=>c.scale.setScalar(Math.max(0.001,fk)));
    // motion
    if(dragX===null){yaw+=yawVel;yawVel*=0.92}
    if(step>=N||view===-1){spinAngle+=dt*0.35}else{spinAngle=Math.atan2(Math.sin(spinAngle),Math.cos(spinAngle))*Math.pow(0.004,dt)}
    const idle=(step>=N)?0:Math.sin(now/1000*0.55)*0.09;
    group.rotation.y=spinAngle+idle+yaw;
    if(step<N&&dragX===null&&now-lastDrag>2500) yaw*=Math.pow(0.16,dt);
    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return {renderer};
}

render(0);
if(view>=0&&view<N) replay();
if(view===N) setTimeout(confetti,400);

initGL().then(r=>{gl=r;$('#loading').style.opacity=0;window.__axoMode='webgl'}).catch(err=>{
  console.warn('Using SVG fallback:',err&&err.message);
  stage.classList.add('use-svg'); $('#loading').style.opacity=0; hint.style.display='none'; window.__axoMode='svg';
  (function loop(now){if(playing){const k=Math.min(1,(now-playStart)/playDur);progress=easeOutQuart(k);if(k>=1)playing=false;updateScrub()}drawSVG();requestAnimationFrame(loop)})(performance.now());
});
setTimeout(()=>{hint.style.opacity=0},6000);

window.__axo={verify,SNAPS,FINAL,go,setProgress:p=>{progress=p;playing=false;updateScrub()},get view(){return view}};
